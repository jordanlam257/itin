<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Itinerary Planner</title>
    <link rel="stylesheet" href="index.css" type="text/css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Travel Itinerary Planner</h1>
            <p>Plan your perfect trip by adding activities to each day.</p>
        </div>

        <div class="add-activity">
            <h2>Add New Activity</h2>
            <form id="activity-form">
                <div class="form-group">
                    <label for="day">Day</label>
                    <select id="day" required>
                        <option value="1">Day 1</option>
                        <option value="2">Day 2</option>
                        <option value="3">Day 3</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="time">Time</label>
                    <input type="time" id="time" required>
                </div>
                <div class="form-group">
                    <label for="activity">Activity</label>
                    <input type="text" id="activity" placeholder="Enter activity name" required>
                </div>
                <div class="form-group">
                    <label for="location">Location</label>
                    <input type="text" id="location" placeholder="Enter location" required>
                </div>
                <div class="form-group">
                    <label for="notes">Notes</label>
                    <textarea id="notes" rows="3" placeholder="Enter any additional notes"></textarea>
                </div>
                <button type="submit" class="btn">Add Activity</button>
            </form>
        </div>

        <div class="days-container" id="days-container"></div>
    </div>

    <script src="index.js"></script>
</body>
</html>
